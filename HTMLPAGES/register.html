<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image" href="../IMAGES/logo.jpg">
    <title>Register | StayFind</title>
    <link rel="stylesheet" href="../CSSPAGES/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="auth-section">
        <div class="auth-box">
            <div class="auth-logo">
                <i class="fa-solid fa-house"></i>
                <a href="../index.html">StayFind</a>
            </div>

            <h1>Create Account</h1>
            <p class="auth-subtitle">Sign up to find or list student housing</p>

            <form id="registerForm">
                <div class="form-group">
                    <div class="input-box"><i class="fa-solid fa-user"></i>
                    <input type="text" id="registerName" placeholder="Full Name"></div>
                </div>

                <div class="form-group">
                    <div class="input-box"><i class="fa-solid fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email Address"></div>
                </div>

                <div class="form-group">
                    <div class="input-box"><i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password">
                    <i class="fa-solid fa-eye-slash eye-icon" id="loginEye"></i></div>
                </div>

                <div class="form-group">
                    <div class="input-box"><i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                    <i class="fa-solid fa-eye-slash eye-icon" id="confirmEye"></i></div>
                </div>

                <button type="submit" class="auth-btn">Sign Up</button>
            </form>

            
             <p class="auth-switch">
                Already have an account?
                <a href="./login.html">Login</a>
            </p>

            <div class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                <a href="../index.html">Back to Home</a>
            </div>

        </div>
    </section>

<script type="module" src="../JS/auth.js"></script>
</body>
</html>
